name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only envs defined in firmware/rallytap/platformio.ini on main.
        # Add hw454b once the feat/hw454b-integrated-oled SDD PR merges.
        env: [esp32dev]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO Core
        run: pip install platformio
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
        working-directory: firmware/rallytap

  test-native:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO Core
        run: pip install platformio
      - name: Run native tests
        run: pio test -e native
        working-directory: firmware/rallytap

  diff-size:
    name: Diff size guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Count added lines vs base
        id: count
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          ADDED=$(git diff --numstat "$BASE...HEAD" 2>/dev/null | awk '{s+=$1} END {print s+0}')
          echo "added=$ADDED"
          echo "added=$ADDED" >> "$GITHUB_OUTPUT"
      - name: Warn on oversized PR
        if: steps.count.outputs.added > 800
        run: |
          echo "::warning::PR adds ${{ steps.count.outputs.added }} lines (>800). Consider splitting into smaller reviewable PRs (chained/stacked)."
